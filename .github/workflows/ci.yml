name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A missing translation key is invisible at runtime: l10n.t() silently
      # falls back to the English source string. Compare source against bundles.
      - run: npm run check:l10n
      # A command declared in package.json but never registered renders a button
      # that throws "command not found" when clicked.
      - run: npm run check:commands
      # Packaging is the real gate: it runs the prepublish build and applies the
      # same manifest checks the marketplace does, so a green build here means
      # vsce would accept the package.
      - run: npx vsce package --no-dependencies
